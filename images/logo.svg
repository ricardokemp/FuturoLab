<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <!-- Fundo -->
    <rect width="500" height="500" rx="80" fill="#2563eb"/>
    
    <!-- Símbolo do FuturoLab - "F" estilizado -->
    <text x="250" y="340" font-family="Arial, sans-serif" font-size="280" font-weight="900" 
          fill="white" text-anchor="middle" letter-spacing="-20">
        F
    </text>
    
    <!-- Linha de progresso / futuro -->
    <rect x="120" y="380" width="260" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
    <rect x="120" y="380" width="160" height="8" rx="4" fill="white"/>
    
    <!-- Círculo decorativo -->
    <circle cx="250" cy="120" r="30" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <circle cx="250" cy="120" r="15" fill="rgba(255,255,255,0.1)" stroke="none"/>
</svg>
