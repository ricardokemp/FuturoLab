<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | FuturoLab</title>

    <meta name="description" content="Crie sua conta no FuturoLab e comece a aprender tecnologia hoje mesmo.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="images/logo-futurolab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 100px 20px 40px;
        }

        .auth-card {
            max-width: 480px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
        }

        .auth-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-card .logo img {
            height: 50px;
        }

        .auth-card .logo h4 {
            margin-top: 12px;
            font-weight: 700;
        }

        .auth-card .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--white);
            border-radius: 12px;
            padding: 14px 18px;
        }

        .auth-card .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .auth-card .form-control.is-invalid {
            border-color: var(--danger);
        }

        .auth-card .btn-primary {
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
        }

        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-card .divider span {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            z-index: 10;
        }

        .password-toggle:hover {
            color: var(--white);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .alert-custom {
            border-radius: 12px;
            padding: 14px 18px;
        }

        .strength-bar {
            height: 4px;
            border-radius: 4px;
            background: var(--border);
            margin-top: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .strength-bar .fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .strength-bar .fill.weak {
            background: var(--danger);
            width: 25%;
        }

        .strength-bar .fill.medium {
            background: var(--warning);
            width: 50%;
        }

        .strength-bar .fill.strong {
            background: var(--success);
            width: 75%;
        }

        .strength-bar .fill.very-strong {
            background: var(--success);
            width: 100%;
        }

        .strength-text {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .terms-check input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            transition: all 0.3s ease;
            width: 100%;
            font-weight: 500;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-light);
        }

        .social-btn.google {
            color: #EA4335;
        }

        .social-btn.google:hover {
            background: rgba(234, 67, 53, 0.1);
            border-color: #EA4335;
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- ============================================
    PÁGINA DE CADASTRO
    ============================================ -->

    <section class="auth-page">
        <div class="auth-card glass-card">

            <!-- Logo -->
            <div class="logo">
                <img src="images/logo-futurolab.png" alt="FuturoLab">
                <h4>Criar Conta</h4>
                <p class="text-muted small">Comece sua jornada no FuturoLab</p>
            </div>

            <!-- Mensagens de Erro/Sucesso -->
            <div id="message" class="alert-custom" style="display:none;"></div>

            <!-- Formulário -->
            <form id="registerForm" novalidate>

                <!-- Nome -->
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required
                        minlength="3" maxlength="100">
                    <div class="invalid-feedback">Nome é obrigatório (mínimo 3 caracteres)</div>
                </div>

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
                    <div class="invalid-feedback">Digite um e-mail válido</div>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required
                            minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('senha', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <div class="fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Mínimo 6 caracteres</div>
                    <div class="invalid-feedback">Senha deve ter no mínimo 6 caracteres</div>
                </div>

                <!-- Confirmar Senha -->
                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="confirmarSenha" placeholder="Confirme sua senha" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('confirmarSenha', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">As senhas não coincidem</div>
                </div>

                <!-- Termos -->
                <div class="mb-4 terms-check">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">
                        Li e aceito os <a href="#" target="_blank">Termos de Uso</a> e a
                        <a href="#" target="_blank">Política de Privacidade</a>
                    </label>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                    <i class="fas fa-user-plus me-2"></i>
                    Criar Conta
                </button>
            </form>

            <!-- Divisor -->
            <div class="divider">
                <span>ou</span>
            </div>

            <!-- Login Social -->
            <button class="social-btn google" onclick="alert('Login com Google em breve!')">
                <i class="fab fa-google"></i>
                Continuar com Google
            </button>

            <!-- Link para Login -->
            <p class="text-center text-muted small mt-4">
                Já tem conta? <a href="login.html" class="auth-link">Fazer Login</a>
            </p>

        </div>
    </section>

    <!-- ============================================
    SCRIPTS
    ============================================ -->

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- API e Auth -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // ============================================
        // TOGGLE SENHA
        // ============================================

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ============================================
        // VALIDAR SENHA EM TEMPO REAL
        // ============================================

        const senhaInput = document.getElementById('senha');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        senhaInput.addEventListener('input', function() {
            const senha = this.value;
            const length = senha.length;

            if (length === 0) {
                strengthFill.className = 'fill';
                strengthFill.style.width = '0%';
                strengthText.textContent = 'Mínimo 6 caracteres';
                return;
            }

            let score = 0;
            if (length >= 6) score++;
            if (length >= 8) score++;
            if (/[A-Z]/.test(senha)) score++;
            if (/[a-z]/.test(senha)) score++;
            if (/[0-9]/.test(senha)) score++;
            if (/[^A-Za-z0-9]/.test(senha)) score++;

            const maxScore = 6;
            const percentage = (score / maxScore) * 100;

            strengthFill.style.width = percentage + '%';

            if (score <= 2) {
                strengthFill.className = 'fill weak';
                strengthText.textContent = 'Senha fraca';
            } else if (score <= 3) {
                strengthFill.className = 'fill medium';
                strengthText.textContent = 'Senha média';
            } else if (score <= 4) {
                strengthFill.className = 'fill strong';
                strengthText.textContent = 'Senha forte';
            } else {
                strengthFill.className = 'fill very-strong';
                strengthText.textContent = 'Senha muito forte';
            }
        });

        // ============================================
        // SUBMIT DO FORMULÁRIO
        // ============================================

        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Resetar validação
            form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            message.style.display = 'none';

            // Coletar dados
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const termos = document.getElementById('termos').checked;

            // Validações
            let hasError = false;

            if (nome.length < 3) {
                document.getElementById('nome').classList.add('is-invalid');
                hasError = true;
            }

            if (!email || !email.includes('@')) {
                document.getElementById('email').classList.add('is-invalid');
                hasError = true;
            }

            if (senha.length < 6) {
                document.getElementById('senha').classList.add('is-invalid');
                hasError = true;
            }

            if (senha !== confirmarSenha) {
                document.getElementById('confirmarSenha').classList.add('is-invalid');
                hasError = true;
            }

            if (!termos) {
                document.getElementById('termos').classList.add('is-invalid');
                hasError = true;
                showMessage('Você precisa aceitar os Termos de Uso', 'danger');
                return;
            }

            if (hasError) {
                showMessage('Por favor, corrija os campos destacados', 'danger');
                return;
            }

            // Mostrar loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Criando conta...';

            try {
                const response = await apiRegister({ nome, email, senha });

                if (response.success) {
                    showMessage('✅ Conta criada com sucesso! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(response.message || 'Erro ao criar conta', 'danger');
                }
            } catch (error) {
                showMessage('Erro ao conectar com o servidor', 'danger');
                console.error(error);
            }

            // Restaurar botão
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Criar Conta';
        });

        // ============================================
        // FUNÇÃO PARA MOSTRAR MENSAGENS
        // ============================================

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'alert-custom alert-' + type;
            message.style.display = 'block';
        }
    </script>

</body>

</html>
