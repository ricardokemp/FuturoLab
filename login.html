<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | FuturoLab</title>

    <meta name="description" content="Faça login no FuturoLab e continue aprendendo tecnologia.">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="images/logo-futurolab.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 100px 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-bg-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .auth-bg-particles span {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 50%;
            animation: floatParticle 10s infinite;
        }

        .auth-bg-particles span:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }
        .auth-bg-particles span:nth-child(2) {
            top: 20%;
            left: 20%;
            animation-delay: 2s;
            width: 8px;
            height: 8px;
        }
        .auth-bg-particles span:nth-child(3) {
            top: 30%;
            right: 10%;
            animation-delay: 4s;
        }
        .auth-bg-particles span:nth-child(4) {
            bottom: 25%;
            left: 15%;
            animation-delay: 1s;
            width: 10px;
            height: 10px;
        }
        .auth-bg-particles span:nth-child(5) {
            bottom: 15%;
            right: 20%;
            animation-delay: 3s;
        }
        .auth-bg-particles span:nth-child(6) {
            top: 50%;
            left: 50%;
            animation-delay: 5s;
            width: 12px;
            height: 12px;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) rotate(360deg);
                opacity: 0;
            }
        }

        .auth-card {
            max-width: 440px;
            width: 100%;
            padding: 40px;
            border-radius: 24px;
            position: relative;
            z-index: 1;
        }

        .auth-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-card .logo img {
            height: 50px;
        }

        .auth-card .logo h4 {
            margin-top: 12px;
            font-weight: 700;
        }

        .auth-card .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--white);
            border-radius: 12px;
            padding: 14px 18px;
            transition: all 0.3s ease;
        }

        .auth-card .form-control:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .auth-card .form-control.is-invalid {
            border-color: var(--danger);
        }

        .auth-card .btn-primary {
            padding: 14px;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .auth-card .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }

        .auth-card .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }

        .auth-card .divider::before,
        .auth-card .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .auth-card .divider span {
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--white);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 45px;
        }

        .alert-custom {
            border-radius: 12px;
            padding: 14px 18px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .remember-forgot a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .remember-forgot a:hover {
            color: var(--primary);
        }

        .remember-forgot input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .auth-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .welcome-back {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .btn-google {
            background: white;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-card {
            animation: slideUp 0.6s ease forwards;
        }

        .auth-card .logo {
            animation: slideUp 0.6s ease 0.1s both;
        }

        .auth-card form {
            animation: slideUp 0.6s ease 0.2s both;
        }

        .auth-card .divider {
            animation: slideUp 0.6s ease 0.3s both;
        }

        .auth-card .btn-google {
            animation: slideUp 0.6s ease 0.4s both;
        }

        .auth-card .text-center {
            animation: slideUp 0.6s ease 0.5s both;
        }

        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ============================================
    BACKGROUND COM PARTÍCULAS
    ============================================ -->

    <div class="auth-bg-particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- ============================================
    PÁGINA DE LOGIN
    ============================================ -->

    <section class="auth-page">
        <div class="auth-card glass-card">

            <!-- Logo -->
            <div class="logo">
                <img src="images/logo-futurolab.png" alt="FuturoLab">
                <h4>Bem-vindo de volta!</h4>
                <p class="welcome-back">Entre com sua conta para continuar aprendendo</p>
            </div>

            <!-- Mensagens de Erro/Sucesso -->
            <div id="message" class="alert-custom" style="display:none;"></div>

            <!-- Formulário -->
            <form id="loginForm" novalidate>

                <!-- E-mail -->
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required autofocus>
                    <div class="invalid-feedback">Digite um e-mail válido</div>
                </div>

                <!-- Senha -->
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
                        <button type="button" class="password-toggle" onclick="togglePassword('senha', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Senha é obrigatória</div>
                </div>

                <!-- Lembrar-me / Esqueceu a senha -->
                <div class="mb-4 remember-forgot">
                    <label class="d-flex align-items-center gap-2">
                        <input type="checkbox" id="lembrar">
                        <span class="text-muted">Lembrar-me</span>
                    </label>
                    <a href="#" onclick="event.preventDefault(); alert('🔐 Função de recuperação de senha em breve!')">
                        Esqueceu a senha?
                    </a>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Entrar
                </button>
            </form>

            <!-- Divisor -->
            <div class="divider">
                <span>ou continue com</span>
            </div>

            <!-- Login com Google -->
            <button class="btn-google" id="googleBtn" onclick="handleGoogleLogin()">
                <i class="fab fa-google" style="color:#EA4335; font-size:1.3rem;"></i>
                Entrar com Google
            </button>

            <!-- Link para Cadastro -->
            <p class="text-center text-muted small mt-4">
                Ainda não tem conta? <a href="cadastro.html" class="auth-link">Criar Conta</a>
            </p>

            <!-- Link para Planos -->
            <p class="text-center text-muted small mt-2">
                <a href="planos.html" class="auth-link">Ver Planos de Assinatura</a>
            </p>

        </div>
    </section>

    <!-- ============================================
    SCRIPTS
    ============================================ -->

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- API e Auth -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>

    <script>
        // ============================================
        // 🔍 LOGS - INÍCIO DA PÁGINA
        // ============================================

        console.log('=========================================');
        console.log('🔍 LOGIN PAGE - Iniciando');
        console.log('=========================================');
        console.log('📌 URL atual:', window.location.href);
        console.log('📌 Timestamp:', new Date().toISOString());

        // ============================================
        // CONFIGURAÇÃO DO FIREBASE (COM SUAS CREDENCIAIS)
        // ============================================

        console.log('🔧 Configurando Firebase...');

        const firebaseConfig = {
            apiKey: "AIzaSyBf34xBZpNRfJ4mtqjw-0T4HcgYle1iX2U",
            authDomain: "futurolab-5cd9a.firebaseapp.com",
            projectId: "futurolab-5cd9a",
            storageBucket: "futurolab-5cd9a.firebasestorage.app",
            messagingSenderId: "375084223693",
            appId: "1:375084223693:web:6dd19140698c3647bb6d84",
            measurementId: "G-WX77D9D670"
        };

        console.log('📋 Firebase Config:');
        console.log('  apiKey:', firebaseConfig.apiKey ? firebaseConfig.apiKey.substring(0, 10) + '...' : '❌ VAZIO');
        console.log('  authDomain:', firebaseConfig.authDomain || '❌ VAZIO');
        console.log('  projectId:', firebaseConfig.projectId || '❌ VAZIO');
        console.log('  appId:', firebaseConfig.appId ? firebaseConfig.appId.substring(0, 15) + '...' : '❌ VAZIO');

        // ============================================
        // INICIALIZAR FIREBASE
        // ============================================

        let firebaseApp, auth;

        try {
            console.log('🔄 Inicializando Firebase...');
            firebaseApp = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            console.log('✅ Firebase inicializado com sucesso!');
            console.log('📌 Auth disponível:', !!auth);
        } catch (error) {
            console.error('❌ Erro ao inicializar Firebase:');
            console.error('   Mensagem:', error.message);
            console.error('   Código:', error.code);
            console.warn('⚠️ Login com Google desabilitado.');
        }

        // ============================================
        // TOGGLE SENHA
        // ============================================

        function togglePassword(inputId, btn) {
            console.log('🔍 Toggle password:', inputId);
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                console.log('👁️ Senha visível');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                console.log('🔒 Senha oculta');
            }
        }

        // ============================================
        // LOGIN COM GOOGLE
        // ============================================

        async function handleGoogleLogin() {
            console.log('=========================================');
            console.log('🔍 FUNÇÃO: handleGoogleLogin()');
            console.log('=========================================');

            const googleBtn = document.getElementById('googleBtn');
            console.log('📌 Botão Google encontrado:', !!googleBtn);

            if (!auth) {
                console.error('❌ Firebase Auth não disponível');
                alert('⚠️ Login com Google não está configurado. Configure o Firebase primeiro.');
                return;
            }

            console.log('✅ Firebase Auth disponível');

            try {
                console.log('🔄 Desabilitando botão...');
                googleBtn.disabled = true;
                googleBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Entrando...';
                console.log('✅ Botão desabilitado');

                console.log('🔄 Criando provider Google...');
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('email');
                provider.addScope('profile');
                console.log('✅ Provider criado');

                console.log('🔄 Abrindo popup de login...');
                const result = await auth.signInWithPopup(provider);
                console.log('✅ Popup concluído!');
                console.log('📌 Resultado:', result);

                const user = result.user;
                console.log('📌 Usuário autenticado:', {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL
                });

                console.log('🔄 Obtendo token ID...');
                const idToken = await user.getIdToken();
                console.log('✅ Token ID obtido');
                console.log('📌 Token (primeiros 30 caracteres):', idToken.substring(0, 30) + '...');

                console.log('🔄 Enviando para o backend...');
                const response = await apiLoginWithGoogle({
                    token: idToken,
                    email: user.email,
                    nome: user.displayName
                });
                console.log('📌 Resposta do backend:', response);

                if (response.success && response.token) {
                    console.log('✅ Login com Google bem-sucedido!');
                    saveToken(response.token, false);
                    showMessage('✅ Login com Google realizado com sucesso!', 'success');
                    setTimeout(() => {
                        console.log('🔄 Redirecionando para dashboard...');
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    console.error('❌ Backend retornou erro:', response.message);
                    showMessage(response.message || 'Erro ao fazer login com Google', 'danger');
                }

            } catch (error) {
                console.error('=========================================');
                console.error('❌ ERRO no login com Google:');
                console.error('📌 Código:', error.code);
                console.error('📌 Mensagem:', error.message);
                console.error('📌 Stack:', error.stack);
                console.error('=========================================');

                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('⚠️ Janela de login foi fechada. Tente novamente.', 'warning');
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    showMessage('⚠️ Esta conta já existe com outro método de login.', 'danger');
                } else if (error.code === 'auth/unauthorized-domain') {
                    showMessage('⚠️ Domínio não autorizado. Adicione este domínio no Firebase Console.', 'danger');
                } else {
                    showMessage('Erro ao fazer login com Google: ' + error.message, 'danger');
                }
            } finally {
                console.log('🔄 Restaurando botão...');
                googleBtn.disabled = false;
                googleBtn.innerHTML = '<i class="fab fa-google" style="color:#EA4335; font-size:1.3rem;"></i> Entrar com Google';
                console.log('✅ Botão restaurado');
                console.log('=========================================');
            }
        }

        // ============================================
        // API - LOGIN COM GOOGLE (backup)
        // ============================================

        async function apiLoginWithGoogle(data) {
            console.log('🔍 FUNÇÃO: apiLoginWithGoogle()');
            console.log('📌 Dados recebidos:', {
                email: data.email,
                nome: data.nome,
                token: data.token ? '✅ Presente' : '❌ Ausente'
            });

            try {
                console.log('🔄 Tentando login via backend...');
                const response = await apiRequest('/auth/google', 'POST', data, false);
                console.log('✅ Resposta do backend:', response);
                return response;
            } catch (error) {
                console.warn('⚠️ Backend não suporta login com Google, usando fallback');
                console.log('📌 Erro:', error.message);

                // Fallback: criar conta temporária com o token
                console.log('🔄 Usando fallback...');
                return {
                    success: true,
                    token: data.token,
                    user: {
                        email: data.email,
                        nome: data.nome
                    }
                };
            }
        }

        // ============================================
        // SUBMIT DO FORMULÁRIO
        // ============================================

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        console.log('📌 Formulário encontrado:', !!form);
        console.log('📌 Message encontrado:', !!message);
        console.log('📌 SubmitBtn encontrado:', !!submitBtn);

        // Verificar se já está logado
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=========================================');
            console.log('🔍 DOMContentLoaded - Verificando token');
            console.log('=========================================');

            console.log('🔄 Chamando getToken()...');
            const token = getToken();
            console.log('📌 Token encontrado:', token ? '✅ Sim' : '❌ Não');

            if (token) {
                console.log('🔄 Token válido, redirecionando para dashboard...');
                window.location.href = 'dashboard.html';
            } else {
                console.log('ℹ️ Nenhum token encontrado, aguardando login.');
            }
        });

        form.addEventListener('submit', async function(e) {
            console.log('=========================================');
            console.log('🔍 EVENTO: submit do formulário');
            console.log('=========================================');

            e.preventDefault();
            console.log('✅ Evento prevenido');

            // Resetar validação
            form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            message.style.display = 'none';
            console.log('🔄 Validação resetada');

            // Coletar dados
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const lembrar = document.getElementById('lembrar').checked;

            console.log('📌 Dados coletados:');
            console.log('   Email:', email);
            console.log('   Senha:', senha ? '********' : '❌ Vazio');
            console.log('   Lembrar:', lembrar);

            // Validações
            let hasError = false;

            if (!email || !email.includes('@')) {
                document.getElementById('email').classList.add('is-invalid');
                hasError = true;
                console.warn('❌ Email inválido');
            }

            if (!senha || senha.length < 6) {
                document.getElementById('senha').classList.add('is-invalid');
                hasError = true;
                console.warn('❌ Senha inválida (menor que 6 caracteres)');
            }

            if (hasError) {
                console.log('❌ Erros encontrados, exibindo mensagem');
                showMessage('Por favor, preencha todos os campos corretamente', 'danger');
                return;
            }

            console.log('✅ Validação OK');

            // Mostrar loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Entrando...';
            console.log('🔄 Botão desabilitado');

            try {
                console.log('🔄 Chamando apiLogin()...');
                const response = await apiLogin({ email, senha });
                console.log('📌 Resposta da API:', response);

                if (response.success && response.token) {
                    console.log('✅ Login bem-sucedido!');
                    saveToken(response.token, lembrar);
                    showMessage('✅ Login realizado com sucesso! Redirecionando...', 'success');
                    console.log('🔄 Redirecionando para dashboard em 1.5s...');
                    setTimeout(() => {
                        console.log('🔄 Redirecionando...');
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    console.error('❌ Login falhou:', response.message);
                    showMessage(response.message || 'E-mail ou senha incorretos', 'danger');
                }
            } catch (error) {
                console.error('=========================================');
                console.error('❌ ERRO no login:');
                console.error('📌 Mensagem:', error.message);
                console.error('📌 Stack:', error.stack);
                console.error('=========================================');
                showMessage('Erro ao conectar com o servidor', 'danger');
            }

            // Restaurar botão
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Entrar';
            console.log('🔄 Botão restaurado');
            console.log('=========================================');
        });

        // ============================================
        // FUNÇÃO PARA MOSTRAR MENSAGENS
        // ============================================

        function showMessage(text, type) {
            console.log(`📝 Mensagem: [${type}] ${text}`);
            message.textContent = text;
            message.className = 'alert-custom alert-' + type;
            message.style.display = 'block';
            message.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ============================================
        // ENTER PARA SUBMIT
        // ============================================

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form && document.activeElement && document.activeElement.closest('#loginForm')) {
                    console.log('🔍 Tecla Enter pressionada no formulário');
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        console.log('=========================================');
        console.log('✅ LOGIN PAGE - Carregada com sucesso!');
        console.log('=========================================');
    </script>

</body>

</html>
